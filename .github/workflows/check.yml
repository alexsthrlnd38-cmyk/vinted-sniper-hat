name: Vinted Watcher Hats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vinted_sniper_hats.py

      - name: Save "seen items" state
        run: |
          git config user.name "vinted-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_items_hats.json
          git diff --quiet --cached || git commit -m "update seen items"
          git push
